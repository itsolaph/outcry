[package]
name = "outcry"
version = "0.1.0"
description = "Outcry: private open-outcry card trading table on a MagicBlock TEE ephemeral rollup"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "outcry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.1.2" }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "access-control", "vrf", "crank"] }
