[package]
name = "outcry-magicsvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
anchor-lang = "=1.1.2"
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "access-control"] }
magicsvm = "0.3.0"
magicblock-account = "4.3"
outcry = { path = "../programs/outcry", features = ["no-entrypoint"] }
serde_json = "1"
solana-account = "3"
solana-address = "~2.6.1"
solana-clock = "3"
solana-hash = "~4.5.0"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-native-token = "3.0.0"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["verify"] }
solana-transaction-error = "3"
